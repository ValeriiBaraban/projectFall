<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="./site/favicon.ico" type="image/x-icon" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wheater</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/site/css/style.css" />
    
  </head>

  <body>
    <div class="container container-text">
      <h1>Wheater</h1>

      <form id="connect-form" novalidate>
        <div class="form-group" >
          <label for="country">Select a country</label>
          <input readonly
            id="country"
            value="United States"
            list="countries"
            class="form-control"
            type="text"
            name="country"
            placeholder="United States"
          />
          <datalist id="countries">
            <option value = "United States"></option>
          </datalist>
          <small id="country-error" class="alert-text"></small>
        </div>


         <div class="form-group" >
          <label for="city">Select a City</label>
          <input
            id="cities"
            list="list-cities"
            class="form-control"
            type="text"
            name="city"
            placeholder="Start type..."
          />
          
          
          <small id="city-error" class="alert-text"></small>
        </div>

        <div class="form-group">
          <input class="btn btn-primary" type="submit" value="Show Weather" />
        </div>
      </form>
    </div>


    <!-- <script src="./js/app.js"></script> -->
    <script src="/site/js/app.js"></script>
  </body>
</html>
