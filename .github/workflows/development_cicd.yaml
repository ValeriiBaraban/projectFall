name: Deploy static site to S3

on:
  push:
    branches: 
      - "main"
      - "development"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
         # aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         # aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          audience: sts.amazonaws.com
          aws-region: us-east-1
          output-env-credentials: true

      - name: Sync site/ to S3 to \site/
        run: |
          aws s3 sync site s3://projectfall.click/site --delete

      - name: Invalidate CloudFront cache
        env:
          AWS_DEFAULT_REGION: us-east-1
        # run: |
        #    aws cloudfront create-invalidation \
        #     --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
        #     --paths "/*"
        run: |
          DIST_ID=$(aws ssm get-parameter --name "/projectfall/cloudfront_id" --query "Parameter.Value" --output text)
          
          echo "Distribution ID: $DIST_ID"
          
          # 2. Invalidate CloudFront cache with the retrieved ID
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"   

      
      
        